name: site

on:
  push:
    branches: [master]
    paths:
      - "kb/patches/**"
      - "src/patchwhisperer/site/**"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Refresh measured tiers
        continue-on-error: true
        run: uv run pw tiers refresh
      - run: uv run pw site build --out site-dist
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: >
          npx --yes wrangler@4 deploy
          --assets site-dist
          --name patch-whisperer
          --compatibility-date 2026-10-01
      - name: Announce new pages on Discord
        if: github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=A "$BEFORE" "$GITHUB_SHA" -- kb/patches > added.txt
            uv run pw site notify added.txt
          fi
      - name: Refresh README screenshots
        if: github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "no before commit; skipping"
            exit 0
          fi
          git diff --name-only "$BEFORE" "$GITHUB_SHA" > changed.txt
          if ! grep -Eq '^(src/patchwhisperer/site/templates/|src/patchwhisperer/site/static/|src/patchwhisperer/site/page\.py$)' changed.txt; then
            echo "no design changes; skipping"
            exit 0
          fi
          sleep 20
          uv run --with playwright playwright install --with-deps chromium
          uv run --with playwright python scripts/readme_screenshots.py https://patch-whisperer.plaid-earth.workers.dev
          if [ -z "$(git status --porcelain docs/images)" ]; then
            echo "screenshots unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          git commit -m "README: refresh screenshots"
          git pull --rebase origin master
          git push origin HEAD:master
